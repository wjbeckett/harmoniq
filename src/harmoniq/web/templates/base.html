<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ page_title | default("Harmoniq") }}{% endblock %}</title>

    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='images/favicon.svg') }}">

    {% block head %}{% endblock %}
</head>
<body>
    <!-- Theme Toggle -->
    <div class="theme-toggle" id="themeToggle">
        <i class="fas fa-sun theme-icon light-icon"></i>
        <i class="fas fa-moon theme-icon dark-icon"></i>
        <i class="fas fa-desktop theme-icon auto-icon"></i>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-music brand-icon"></i>
                <span class="brand-text">Harmoniq</span>
            </div>

            <div class="nav-links">
                <a href="/" class="nav-link active">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/recommendations" class="nav-link">
                    <i class="fas fa-compact-disc"></i>
                    <span>Recommendations</span>
                </a>
                <a href="/config" class="nav-link">
                    <i class="fas fa-cog"></i>
                    <span>Configuration</span>
                </a>
                <a href="/logs" class="nav-link">
                    <i class="fas fa-file-alt"></i>
                    <span>Logs</span>
                </a>
                <a href="/api/docs" class="nav-link" target="_blank">
                    <i class="fas fa-code"></i>
                    <span>API</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 Harmoniq - Intelligent Music Library Management</p>
            <div class="footer-links">
                <a href="https://github.com/your-username/harmoniq" target="_blank">
                    <i class="fab fa-github"></i>
                </a>
            </div>
        </div>
    </footer>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Base JavaScript -->
    <script src="{{ url_for('static', path='js/theme.js') }}"></script>
    <script src="{{ url_for('static', path='js/utils.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
