services:
  harmoniq:
    # Use 'build: ./src' if building locally instead of pulling a pre-built image
    build:
      context: ./src
      dockerfile: Dockerfile
    # image: your_username/harmoniq:latest # Or use build context
    container_name: harmoniq
    # 'restart: unless-stopped' is fine even for Phase 1, it won't restart after finishing.
    # It's ready for Phase 2 continuous operation.
    restart: unless-stopped
    ports:
      - "7845:7845"  # Web UI port
    volumes:
      - ./config/:/app/config/:ro
      - ./logs:/app/logs  # For web UI logs (optional)
    environment:
      - HARMONIQ_WEB_HOST=0.0.0.0
      - HARMONIQ_WEB_PORT=7845
    #  - CONFIG_FILE_PATH=/app/config/config.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7845/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
